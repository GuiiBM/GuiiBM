name: Perfil dinâmico

# Gera as imagens e selos do perfil (banner, gráficos, cobrinha, gráfico 3D...)
# e publica tudo na branch "output". Na main, o único commit possível é o dos
# blocos <!-- auto:... --> do README, e só quando o texto deles muda (ordem dos
# repositórios, descrições ou curriculo.py). Os números não entram nesses
# blocos: são selos, que mudam sem commit. O .vscode/settings.json deixa o Sync
# com rebase e autostash para esses commits não atrapalharem.
#
# Escutador: o job "escutar" compara uma assinatura da conta (último evento
# público, último push em outro repositório, número de repositórios e
# seguidores, e a data de hoje) com a da última geração. Só quando algo mudou o
# job "gerar" redesenha o perfil. A assinatura só é gravada quando a publicação
# dá certo, então uma falha se corrige sozinha na execução seguinte.
#
# O agendamento pede uma execução a cada 10 minutos, mas o GitHub atrasa e
# descarta execuções agendadas: na prática têm sido poucas por dia. Para
# atualizar na hora, use "Run workflow" na aba Actions.

on:
  schedule:
    - cron: "3-59/10 * * * *"
  workflow_dispatch:        # permite rodar manualmente pela aba Actions
    inputs:
      tema:
        description: "Forçar um tema (ex.: natal, halloween, padrao). Vazio = tema do dia"
        required: false
        default: ""
  repository_dispatch:      # outro repositório ou webhook pode pedir uma atualização na hora
    types: [atualizar]
  push:
    branches:
      - main
    paths:
      - ".github/scripts/**"
      - ".github/workflows/perfil-dinamico.yml"

permissions:
  contents: write

jobs:
  escutar:
    runs-on: ubuntu-latest
    outputs:
      mudou: ${{ steps.verificar.outputs.mudou }}
      assinatura: ${{ steps.verificar.outputs.assinatura }}
    steps:
      - name: Verificar se há novidade na conta
        id: verificar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DONO: ${{ github.repository_owner }}
          EVENTO: ${{ github.event_name }}
        run: |
          dia=$(TZ=America/Sao_Paulo date +%F)
          evento=$(gh api "users/$DONO/events/public?per_page=1" --jq '.[0].id // ""' || true)
          # O próprio repositório do perfil fica de fora: a publicação na
          # branch "output" mexe no pushed_at dele e geraria um laço.
          push=$(gh api "users/$DONO/repos?sort=pushed&per_page=10" \
            --jq 'map(select(.name != env.DONO)) | .[0] | "\(.name)@\(.pushed_at)"' || true)
          conta=$(gh api "users/$DONO" --jq '"\(.public_repos)/\(.followers)"' || true)
          assinatura="$dia|$evento|$push|$conta"
          anterior=$(gh api "repos/$REPO/contents/assinatura.txt?ref=output" \
            -H "Accept: application/vnd.github.raw" 2>/dev/null || true)
          echo "Atual:    $assinatura"
          echo "Anterior: $anterior"
          if [ "$EVENTO" != "schedule" ] || [ "$assinatura" != "$anterior" ]; then
            echo "mudou=true" >> "$GITHUB_OUTPUT"
          else
            echo "mudou=false" >> "$GITHUB_OUTPUT"
          fi
          echo "assinatura=$assinatura" >> "$GITHUB_OUTPUT"

  gerar:
    needs: escutar
    if: needs.escutar.outputs.mudou == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: perfil-dinamico
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recuperar os dados da última coleta
        env:
          REPO: ${{ github.repository }}
        run: |
          mkdir -p dist
          curl -sfL "https://raw.githubusercontent.com/$REPO/output/dados.json" -o dist/dados.json || rm -f dist/dados.json

      - name: Gerar imagens, selos e blocos do README no tema do dia
        id: gerar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEMA: ${{ inputs.tema }}
          ASSINATURA: ${{ needs.escutar.outputs.assinatura }}
        run: |
          python .github/scripts/perfil.py --saida dist --readme ${TEMA:+--tema "$TEMA"}
          printf '%s' "$ASSINATURA" > dist/assinatura.txt

      - name: Gerar o gráfico 3D de contribuições
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Escolher a variação do gráfico 3D do tema
        env:
          VARIANTE: ${{ steps.gerar.outputs.perfil3d }}
        run: cp "profile-3d-contrib/$VARIANTE" dist/perfil-3d.svg

      - name: Gerar a cobrinha com as cores do tema
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=${{ steps.gerar.outputs.cobra_clara }}&color_dots=${{ steps.gerar.outputs.pontos_claro }}
            dist/github-snake-dark.svg?palette=github-dark&color_snake=${{ steps.gerar.outputs.cobra }}&color_dots=${{ steps.gerar.outputs.pontos_escuro }}

      # Publicado antes do commit do README: quando a lista muda, os selos dos
      # repositórios novos já existem. O GitHub às vezes recusa um push por erro
      # temporário, por isso as novas tentativas.
      - name: Publicar na branch "output"
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publica as imagens e os selos do perfil"
          for tentativa in 1 2 3 4 5; do
            if git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" output; then
              exit 0
            fi
            echo "Push recusado (tentativa $tentativa de 5)."
            sleep $((tentativa * 20))
          done
          exit 1

      - name: Commitar os blocos do README, só se o texto mudou
        if: github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- README.md; then
            echo "README sem mudanças: nenhum commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Atualiza a lista de projetos do README"
          for tentativa in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Push recusado (tentativa $tentativa de 5)."
            git rebase --abort 2>/dev/null || true
            sleep $((tentativa * 20))
          done
          exit 1
