name: Perfil dinâmico

# Gera as imagens do perfil (banner, cards, cobrinha, gráfico 3D...) e publica
# tudo na branch "output". Este workflow nunca faz commit na main, então o
# Sync do VS Code não diverge por causa dele.

on:
  schedule:
    - cron: "5 3 * * *"   # todo dia às 00:05 (horário de Brasília)
  workflow_dispatch:        # permite rodar manualmente pela aba Actions
    inputs:
      tema:
        description: "Forçar um tema (ex.: natal, halloween, padrao). Vazio = tema do dia"
        required: false
        default: ""
  push:
    branches:
      - main
    paths:
      - ".github/scripts/**"
      - ".github/workflows/perfil-dinamico.yml"

permissions:
  contents: write

concurrency:
  group: perfil-dinamico
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recuperar os dados da última coleta
        env:
          REPO: ${{ github.repository }}
        run: |
          mkdir -p dist
          curl -sfL "https://raw.githubusercontent.com/$REPO/output/dados.json" -o dist/dados.json || rm -f dist/dados.json

      - name: Gerar banner, cards e cabeçalhos no tema do dia
        id: gerar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TEMA: ${{ inputs.tema }}
        run: python .github/scripts/perfil.py --saida dist ${TEMA:+--tema "$TEMA"}

      - name: Gerar o gráfico 3D de contribuições
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Escolher a variação do gráfico 3D do tema
        env:
          VARIANTE: ${{ steps.gerar.outputs.perfil3d }}
        run: cp "profile-3d-contrib/$VARIANTE" dist/perfil-3d.svg

      - name: Gerar a cobrinha com as cores do tema
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=${{ steps.gerar.outputs.cobra }}&color_dots=${{ steps.gerar.outputs.pontos_claro }}
            dist/github-snake-dark.svg?palette=github-dark&color_snake=${{ steps.gerar.outputs.cobra }}&color_dots=${{ steps.gerar.outputs.pontos_escuro }}

      - name: Publicar na branch "output"
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
