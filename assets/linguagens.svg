<svg xmlns="http://www.w3.org/2000/svg" width="350" height="210" viewBox="0 0 350 210" role="img" aria-label="Linguagens mais usadas">
  <title>Linguagens mais usadas</title>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .titulo { font-size: 18px; font-weight: 600; fill: #a855f7; }
    .rotulo { font-size: 13.5px; fill: #e2e8f0; }
    .valor { font-size: 13.5px; font-weight: 700; fill: #ffffff; }
    .apagado { font-size: 11.5px; fill: #8b949e; }
    .surge { opacity: 0; animation: surgir .6s ease-out forwards; }
    @keyframes surgir { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .surge, .anima { animation: none !important; opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7e22ce"/><stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <clipPath id="card"><rect x="0.5" y="0.5" width="349" height="209" rx="10"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="349" height="209" rx="10" fill="#0d1117" stroke="#7e22ce" stroke-opacity="0.6"/>
  <rect x="0" y="0" width="350" height="4" fill="url(#grad)" clip-path="url(#card)"/>
  <text x="25" y="38" class="titulo">Linguagens mais usadas</text>
  <clipPath id="barra"><rect x="25" y="56" width="300" height="10" rx="5"/></clipPath>
  <g clip-path="url(#barra)" class="surge"><rect x="25.00" y="56" width="234.13" height="10" fill="#3572A5"/><rect x="259.13" y="56" width="32.86" height="10" fill="#e34c26"/><rect x="291.99" y="56" width="14.40" height="10" fill="#f1e05a"/><rect x="306.39" y="56" width="9.10" height="10" fill="#4F5D95"/><rect x="315.49" y="56" width="8.85" height="10" fill="#663399"/></g>
  <g class="surge" style="animation-delay:200ms"><circle cx="30" cy="99.5" r="5" fill="#3572A5"/><text x="41" y="104" class="rotulo">Python</text><text x="165" y="104" class="apagado" text-anchor="end">78.0%</text></g>
  <g class="surge" style="animation-delay:270ms"><circle cx="30" cy="131.5" r="5" fill="#e34c26"/><text x="41" y="136" class="rotulo">HTML</text><text x="165" y="136" class="apagado" text-anchor="end">11.0%</text></g>
  <g class="surge" style="animation-delay:340ms"><circle cx="30" cy="163.5" r="5" fill="#f1e05a"/><text x="41" y="168" class="rotulo">JavaScript</text><text x="165" y="168" class="apagado" text-anchor="end">4.8%</text></g>
  <g class="surge" style="animation-delay:410ms"><circle cx="190" cy="99.5" r="5" fill="#4F5D95"/><text x="201" y="104" class="rotulo">PHP</text><text x="325" y="104" class="apagado" text-anchor="end">3.0%</text></g>
  <g class="surge" style="animation-delay:480ms"><circle cx="190" cy="131.5" r="5" fill="#663399"/><text x="201" y="136" class="rotulo">CSS</text><text x="325" y="136" class="apagado" text-anchor="end">2.9%</text></g>
</svg>
