<svg xmlns="http://www.w3.org/2000/svg" width="460" height="150" viewBox="0 0 460 150" role="img" aria-label="CalcularPassagens">
  <title>CalcularPassagens</title>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .titulo { font-size: 18px; font-weight: 600; fill: #a855f7; }
    .rotulo { font-size: 13.5px; fill: #e2e8f0; }
    .valor { font-size: 13.5px; font-weight: 700; fill: #ffffff; }
    .apagado { font-size: 11.5px; fill: #8b949e; }
    .surge { animation: surgir .6s ease-out both; }
    @keyframes surgir { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .surge, .anima { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7e22ce"/><stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <clipPath id="card"><rect x="0.5" y="0.5" width="459" height="149" rx="10"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="459" height="149" rx="10" fill="#0d1117" stroke="#7e22ce" stroke-opacity="0.6"/>
  <rect x="0" y="0" width="460" height="4" fill="url(#grad)" clip-path="url(#card)"/>
  <text x="25" y="38" class="titulo">CalcularPassagens</text>
  <g class="surge"><text x="25" y="70" class="rotulo" style="fill:#8b949e">Sem descrição por enquanto. Abra o repositório para ver o</text><text x="25" y="90" class="rotulo" style="fill:#8b949e">código.</text></g>
  <circle cx="31" cy="125.5" r="6" fill="#e34c26"/><text x="43" y="130" class="apagado" style="font-size:12.5px">HTML</text><text x="435" y="130" class="apagado" text-anchor="end" style="font-size:12.5px">atualizado há 31 dias</text>
  <path transform="translate(435 22)" fill="#a855f7" opacity=".45" d="M-14 0h10a3 3 0 0 1 3 3v12a2 2 0 0 0-2-2h-11zM2 0h10v13H1a2 2 0 0 0-2 2V3a3 3 0 0 1 3-3z"/>
