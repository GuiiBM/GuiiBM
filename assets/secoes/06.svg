<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="72" viewBox="0 0 1000 72" role="img" aria-label="[0x06] Calendário 3D de Contribuições">
  <title>[0x06] Calendário 3D de Contribuições</title>
  <style>
    .brilho { animation: varrer 5s ease-in-out infinite; }
    .cursor { animation: piscar 1s steps(1) infinite; }
    @keyframes varrer { from { transform: translateX(-300px); } to { transform: translateX(1300px); } }
    @keyframes piscar { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .brilho, .cursor { animation: none; } .brilho { display: none; } }
  </style>
  <defs>
    <linearGradient id="lateral" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7e22ce"/><stop offset="100%" stop-color="#ef4444"/></linearGradient>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7e22ce" stop-opacity=".16"/><stop offset="60%" stop-color="#0d1117" stop-opacity="0"/></linearGradient>
    <linearGradient id="luz" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity=".06"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="barra"><rect x=".5" y=".5" width="999" height="71" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#barra)">
    <rect width="1000" height="72" fill="#0d1117"/>
    <rect width="1000" height="72" fill="url(#fundo)"/>
    <rect width="5" height="72" fill="url(#lateral)"/>
    <rect x="0" width="260" height="72" fill="url(#luz)" class="brilho"/>
  </g>
  <rect x=".5" y=".5" width="999" height="71" rx="12" fill="none" stroke="#7e22ce" stroke-opacity=".5"/>

  <rect x="26" y="19" width="78" height="34" rx="8" fill="#7e22ce" fill-opacity=".16" stroke="#7e22ce" stroke-opacity=".75"/>
  <text x="65" y="41" text-anchor="middle" style="font:700 15px 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace;fill:#a855f7">0x06</text>
  <text x="124" y="34" style="font:700 22px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif;fill:#ffffff">Calendário 3D de Contribuições</text>
  <text x="124" y="56" style="font:500 12.5px 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace;fill:#8b949e"><tspan fill="#ef4444">$</tspan> render --isometric --year<tspan class="cursor" fill="#a855f7"> ▌</tspan></text>

  <text x="974" y="30" text-anchor="end" style="font:600 12px 'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace;fill:#8b949e;letter-spacing:1px">06 / 07</text>
