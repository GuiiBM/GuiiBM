<svg xmlns="http://www.w3.org/2000/svg" width="495" height="210" viewBox="0 0 495 210" role="img" aria-label="Estatísticas de GuiiBM">
  <title>Estatísticas de GuiiBM</title>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .titulo { font-size: 18px; font-weight: 600; fill: #a855f7; }
    .rotulo { font-size: 13.5px; fill: #e2e8f0; }
    .valor { font-size: 13.5px; font-weight: 700; fill: #ffffff; }
    .apagado { font-size: 11.5px; fill: #8b949e; }
    .surge { opacity: 0; animation: surgir .6s ease-out forwards; }
    @keyframes surgir { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .surge, .anima { animation: none !important; opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7e22ce"/><stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <clipPath id="card"><rect x="0.5" y="0.5" width="494" height="209" rx="10"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="494" height="209" rx="10" fill="#0d1117" stroke="#7e22ce" stroke-opacity="0.6"/>
  <rect x="0" y="0" width="495" height="4" fill="url(#grad)" clip-path="url(#card)"/>
  <text x="25" y="38" class="titulo">Estatísticas de GuiiBM</text>
  <g class="surge" style="animation-delay:150ms"><circle cx="31" cy="67.5" r="4" fill="#7e22ce"/><text x="44" y="72" class="rotulo">Contribuições (último ano)</text><text x="300" y="72" class="valor" text-anchor="end">421</text></g>
  <g class="surge" style="animation-delay:240ms"><circle cx="31" cy="90.5" r="4" fill="#ef4444"/><text x="44" y="95" class="rotulo">Commits</text><text x="300" y="95" class="valor" text-anchor="end">169</text></g>
  <g class="surge" style="animation-delay:330ms"><circle cx="31" cy="113.5" r="4" fill="#7e22ce"/><text x="44" y="118" class="rotulo">Pull requests</text><text x="300" y="118" class="valor" text-anchor="end">5</text></g>
  <g class="surge" style="animation-delay:420ms"><circle cx="31" cy="136.5" r="4" fill="#ef4444"/><text x="44" y="141" class="rotulo">Issues</text><text x="300" y="141" class="valor" text-anchor="end">0</text></g>
  <g class="surge" style="animation-delay:510ms"><circle cx="31" cy="159.5" r="4" fill="#7e22ce"/><text x="44" y="164" class="rotulo">Repositórios públicos</text><text x="300" y="164" class="valor" text-anchor="end">14</text></g>
  <g class="surge" style="animation-delay:600ms"><circle cx="31" cy="182.5" r="4" fill="#ef4444"/><text x="44" y="187" class="rotulo">Estrelas recebidas</text><text x="300" y="187" class="valor" text-anchor="end">0</text></g>
  <style>
    .anel { stroke-dasharray: 276.5; stroke-dashoffset: 276.5; animation: encher 1.2s ease-out .3s forwards; }
    @keyframes encher { to { stroke-dashoffset: 230.4; } }
    @media (prefers-reduced-motion: reduce) { .anel { animation: none; stroke-dashoffset: 230.4; } }
  </style>
  <circle cx="400" cy="118" r="44" fill="none" stroke="#7e22ce" stroke-opacity="0.18" stroke-width="7"/>
  <circle cx="400" cy="118" r="44" fill="none" stroke="url(#grad)" stroke-width="7" stroke-linecap="round" class="anel" transform="rotate(-90 400 118)"/>
  <text x="400" y="120" text-anchor="middle" style="font-size:28px;font-weight:700;fill:#a855f7">2</text>
  <text x="400" y="138" text-anchor="middle" class="apagado">dias seguidos</text>
  <text x="400" y="186" text-anchor="middle" class="apagado">recorde: 12 dias</text>
</svg>
