                    values='m0,19 h0 ; m0,19 h0 ; m0,19 h600 ; m0,19 h600' keyTimes='0;0;0.9;1' />
                    </path>
    <text font-family='"JetBrains Mono", monospace' fill='#ef4444' font-size='14'
