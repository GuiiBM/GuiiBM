<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="404" viewBox="0 0 1000 404" role="img" aria-label="Linha do tempo">
  <title>Linha do tempo</title>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .titulo { font-size: 18px; font-weight: 600; fill: #a855f7; }
    .rotulo { font-size: 13.5px; fill: #e2e8f0; }
    .valor { font-size: 13.5px; font-weight: 700; fill: #ffffff; }
    .apagado { font-size: 11.5px; fill: #8b949e; }
    .surge { animation: surgir .6s ease-out both; }
    @keyframes surgir { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .surge, .anima { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7e22ce"/><stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <clipPath id="card"><rect x="0.5" y="0.5" width="999" height="403" rx="10"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="999" height="403" rx="10" fill="#0d1117" stroke="#7e22ce" stroke-opacity="0.6"/>
  <rect x="0" y="0" width="1000" height="4" fill="url(#grad)" clip-path="url(#card)"/>
  <text x="25" y="38" class="titulo">Linha do tempo</text>
  <style>
    .barra { transform-box: fill-box; transform-origin: left center; animation: crescer 1.1s cubic-bezier(.2,.8,.2,1) backwards; }
    .medalha { animation: surgir .6s ease-out backwards; }
    @keyframes crescer { from { transform: scaleX(0); } }
    @media (prefers-reduced-motion: reduce) { .barra, .medalha { animation: none; } }
  </style>
